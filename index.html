<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>29</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f3ecd8;font-family:Georgia,'Times New Roman',serif;text-align:center;background:radial-gradient(ellipse at 50% 30%,#14503a 0%,#0a2c20 60%,#061a13 100%);-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:auto;padding:12px 10px 20px}
small{font:11px system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.65;display:block}
.hdr{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid #d4af3755}
.hdr b{font-size:20px;color:#d4af37}
.chip{padding:4px 16px;border:1px solid #d4af37;border-radius:30px}
.chip>span{font-size:26px;line-height:1}.red{color:#d9434d}
.felt{display:grid;grid-template-columns:64px 1fr 64px;grid-template-areas:". st ." "sl ctr sr";gap:6px;margin:14px 0 6px;align-items:center}
.seat{padding:8px 4px;border-radius:12px;border:1px solid #ffffff22;font-size:14px;background:#0003;transition:.2s}
.seat small{margin-top:2px;font-size:10px}
.seat.t{border-color:#d4af37;box-shadow:0 0 14px #d4af3777;background:#d4af3722}
.st{grid-area:st;justify-self:center;width:120px}.sl{grid-area:sl}.sr{grid-area:sr}
.ctr{grid-area:ctr;display:grid;grid-template:repeat(3,70px)/repeat(3,1fr);justify-items:center;align-items:center}
.s2{grid-area:1/2}.s1{grid-area:2/1}.s3{grid-area:2/3}.s0{grid-area:3/2}
.c{width:54px;height:78px;border-radius:8px;border:1px solid #cfc7ae;background:#fbf8ef;color:#1b1b1b;font-family:Georgia,serif;padding:4px 0;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 2px 6px #0007}
.c i{font-style:normal;font-size:19px;font-weight:700;line-height:1}.c b{font-size:30px;line-height:1;font-weight:400}
.c.r{color:#b3262e}
.tc{width:48px;height:68px;pointer-events:none}.tc i{font-size:16px}.tc b{font-size:24px}
.pop{animation:pop .3s ease-out}@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:none;opacity:1}}
.hand{display:flex;justify-content:center;margin-top:18px;padding-top:14px;min-height:96px}
.hand .c{margin-left:-20px;transition:transform .15s;filter:brightness(.62)}
.hand .c:first-child{margin-left:0}
.hand .c.on{filter:none;transform:translateY(-14px);box-shadow:0 6px 12px #000a}
.hand .c.on:active{transform:translateY(-24px)}
.msg{min-height:22px;margin:6px;color:#d4af37;font-size:15px;font-style:italic}
.act{min-height:50px}
.b{padding:10px 22px;margin:4px;border:1px solid #d4af37;border-radius:30px;background:#d4af37;color:#1a1405;font:600 15px Georgia,serif;cursor:pointer}
.b.ghost,.b.n{background:transparent;color:#d4af37}
.b.n{width:48px;padding:9px 0}.b:active{opacity:.7}
.suit{font-size:28px;width:62px;padding:6px 0}
input{padding:11px;border-radius:30px;border:1px solid #d4af37;background:transparent;color:#f3ecd8;width:100px;text-align:center;font:600 16px Georgia,serif;letter-spacing:.2em;text-transform:uppercase}
.menu{padding-top:12vh}.menu h1{font-size:88px;margin:0;color:#d4af37;font-weight:400}
.menu p{opacity:.7;margin:0 0 30px}.or{margin:26px 0 10px;font-size:13px;opacity:.6}
</style></head><body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// 29 — host browser is the referee. Seats 0&2 vs 1&3. Empty seats = bots.
// NOTE: your "7th hand" rule is NOT implemented yet.
const S=['♠','♥','♦','♣'],R=['J','9','A','10','K','Q','8','7'],PT={J:3,9:2,A:1,10:1};
const pv=c=>PT[c.slice(0,-1)]||0,rk=c=>R.indexOf(c.slice(0,-1)),su=c=>c.slice(-1);
const $=id=>document.getElementById(id);
let G,peer,conns={},conn,me=0,isHost=false,V=null,code='',T;

function newG(){return{ph:'lobby',human:[1,0,0,0],dealer:3,sc:[0,0],hands:[[],[],[],[]],deck:[],passed:[0,0,0,0],high:null,prev:null,turn:0,first:0,trump:null,trick:[],pts:[0,0],tricks:0,target:0,msg:'',lock:0}}
function deal(){let d,bad;do{d=[];for(const s of S)for(const r of R)d.push(r+s);
 for(let i=31;i>0;i--){const j=Math.random()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}
 G.hands=[0,1,2,3].map(i=>d.slice(i*4,i*4+4));bad=G.hands.some(h=>h.filter(c=>c[0]=='J').length==4);}while(bad);
 G.deck=d.slice(16);G.ph='bid';G.passed=[0,0,0,0];G.high=null;G.prev=null;G.trump=null;G.trick=[];G.pts=[0,0];G.tricks=0;G.lock=0;G.turn=G.first=(G.dealer+1)%4}
function redeal(){G.dealer=(G.dealer+1)%4;deal()}
function bid(s,v){if(G.ph!='bid'||s!=G.turn)return;
 if(v){const h=G.high;if(!(v>=16&&v<=28&&(!h||v>h.v||(v==h.v&&G.prev==s))))return;G.prev=h?h.s:null;G.high={s,v}}else G.passed[s]=1;
 if(G.passed.every(x=>x)){G.msg='Everyone passed — redealt';return redeal()}
 let n=(s+1)%4;while(G.passed[n])n=(n+1)%4;
 if(G.high&&n==G.high.s){G.ph='trump';G.turn=n;G.msg=''}else G.turn=n}
function setTrump(s,t){if(G.ph!='trump'||s!=G.turn||!S.includes(t))return;G.trump=t;
 for(let i=0;i<4;i++)G.hands[i]=G.hands[i].concat(G.deck.slice(i*4,i*4+4));
 const hs=G.high.s,opp=[(hs+1)%4,(hs+3)%4];
 if(opp.some(i=>!G.hands[i].some(c=>su(c)==t&&pv(c)))){G.msg='Redealt: an opponent had no trump points';return redeal()}
 let tg=G.high.v;const m=G.hands.findIndex(h=>h.includes('K'+t)&&h.includes('Q'+t));G.msg='';
 if(m>=0){if(m%2==hs%2){tg=Math.max(16,tg-4);G.msg='Marriage with bidding team: target −4'}else{tg+=4;G.msg='Marriage with opponents: target +4'}}
 G.target=tg;G.ph='play';G.turn=G.first}
function legal(s){const h=G.hands[s];if(!G.trick.length)return h;const f=h.filter(c=>su(c)==su(G.trick[0].c));return f.length?f:h}
function win(tr){const t=tr.filter(x=>su(x.c)==G.trump),p=t.length?t:tr.filter(x=>su(x.c)==su(tr[0].c));return p.reduce((a,b)=>rk(b.c)<rk(a.c)?b:a).s}
function play(s,c){if(G.ph!='play'||G.lock||s!=G.turn||!legal(s).includes(c))return;
 G.hands[s]=G.hands[s].filter(x=>x!=c);G.trick.push({s,c});
 if(G.trick.length==4){G.lock=1;G.turn=-1;setTimeout(resolve,1300)}else G.turn=(s+1)%4}
function resolve(){const w=win(G.trick),sum=G.trick.reduce((a,t)=>a+pv(t.c),0);G.pts[w%2]+=sum;G.tricks++;G.trick=[];G.lock=0;G.turn=w;
 if(G.tricks==8){G.pts[w%2]++;const bt=G.high.s%2,ok=G.pts[bt]>=G.target;G.sc[ok?bt:1-bt]++;G.ph='over';
  G.msg=(ok?'Bidding team made it: ':'Bidding team failed: ')+G.pts[bt]+' vs target '+G.target}
 bc();tick()}
function botAct(s){const h=G.hands[s];
 if(G.ph=='bid'){const p=h.reduce((a,c)=>a+pv(c),0),est=Math.min(20,14+p+(S.some(x=>h.filter(c=>su(c)==x).length>=3)?1:0)),hi=G.high;
  if(s==G.first&&!hi&&G.passed.every(x=>!x)&&!p)return redeal();
  const v=hi?(G.prev==s?hi.v:hi.v+1):16;bid(s,v<=est?v:0)}
 else if(G.ph=='trump'){const sc=x=>h.filter(c=>su(c)==x).reduce((a,c)=>a+2+pv(c),0);setTrump(s,S.reduce((a,b)=>sc(b)>sc(a)?b:a))}
 else{const L=legal(s);let c;
  if(!G.trick.length)c=L.reduce((a,b)=>rk(b)<rk(a)?b:a);
  else{const part=win(G.trick)%2==s%2,beat=L.filter(x=>win(G.trick.concat({s,c:x}))==s);
   c=!part&&beat.length?beat.reduce((a,b)=>rk(b)>rk(a)?b:a):L.reduce((a,b)=>pv(b)<pv(a)||(pv(b)==pv(a)&&rk(b)>rk(a))?b:a)}
  play(s,c)}}
function tick(){clearTimeout(T);T=setTimeout(()=>{if(['bid','trump','play'].includes(G.ph)&&!G.lock&&G.turn>=0&&!G.human[G.turn]){botAct(G.turn);bc();tick()}},800)}

function view(i){const hi=G.high,min=hi?(G.prev==i?hi.v:hi.v+1):16,h=G.hands[i];
 return{me:i,ph:G.ph,hand:h,cnt:G.hands.map(x=>x.length),turn:G.turn,high:hi,min,trump:G.trump,trick:G.trick,pts:G.pts,target:G.target,sc:G.sc,msg:G.msg,human:G.human,host:i==0,
  legal:G.ph=='play'&&G.turn==i?legal(i):[],canRedeal:G.ph=='bid'&&G.turn==i&&i==G.first&&!hi&&G.passed.every(x=>!x)&&!h.reduce((a,c)=>a+pv(c),0)}}
function bc(){for(const i in conns)conns[i].open&&conns[i].send(view(+i));V=view(0);render()}
function act(s,m){if(!G)return;
 if(m.t=='bid')bid(s,m.v);else if(m.t=='trump')setTrump(s,m.s);else if(m.t=='play')play(s,m.c);
 else if(m.t=='redeal'&&view(s).canRedeal)redeal();
 else if(m.t=='start'&&s==0&&G.ph=='lobby'){G.msg='';deal()}
 else if(m.t=='next'&&s==0&&G.ph=='over'){G.msg='';redeal()}
 bc();tick()}
function send(m){isHost?act(0,m):conn&&conn.send(m)}
function hostGame(){isHost=true;me=0;G=newG();code=Math.random().toString(36).slice(2,6).toUpperCase();
 peer=new Peer('tw29-'+code);
 peer.on('open',()=>{V=view(0);render()});
 peer.on('connection',c=>{const s=[1,2,3].find(i=>!G.human[i]);if(!s){c.on('open',()=>c.close());return}
  G.human[s]=1;conns[s]=c;c.on('open',()=>bc());c.on('data',m=>act(s,m));
  c.on('close',()=>{delete conns[s];G.human[s]=0;bc();tick()})})}
function joinGame(){code=$('code').value.trim().toUpperCase();if(!code)return;peer=new Peer();
 peer.on('open',()=>{conn=peer.connect('tw29-'+code);conn.on('data',m=>{V=m;render()});conn.on('close',()=>{$('app').innerHTML='<p>Disconnected from host.</p>'})});
 peer.on('error',e=>alert('Could not connect: '+e.type))}

const card=(c,on,fn,x='')=>{const r=c.slice(0,-1),s=su(c);return `<button class="c ${'♥♦'.includes(s)?'r':''} ${on?'on':''} ${x}" ${on?'':'disabled'} ${fn?`onclick="${fn}"`:''}><i>${r}</i><b>${s}</b></button>`};
function render(){const a=$('app'),v=V;
 if(!v){a.innerHTML=`<div class=menu><h1>29</h1><p>Marriage · 2 v 2 · play with friends</p><button class=b onclick="hostGame()">Create room</button><div class=or>or join a friend</div><div><input id=code placeholder="CODE" maxlength=4> <button class="b ghost" onclick="joinGame()">Join</button></div></div>`;return}
 const nm=i=>['You','Left','Partner','Right'][(i-v.me+4)%4],us=v.me%2;
 const seat=(r,cls)=>{const s=(v.me+r)%4;return `<div class="seat ${cls} ${v.turn==s?'t':''}">${nm(s)}${v.human[s]?'':' 🤖'}<small>${v.cnt[s]} cards</small></div>`};
 const playing=v.ph=='play';
 let h=`<div class=hdr><div><small>Games</small><b>${v.sc[us]} – ${v.sc[1-us]}</b></div><div class=chip><span class="${'♥♦'.includes(v.trump)?'red':''}">${v.trump||'—'}</span><small>${v.high?'Bid '+v.high.v+' · '+nm(v.high.s):'No bid'}</small></div><div><small>${playing?'Target '+v.target:'Room'}</small><b>${playing?v.pts[us]+' – '+v.pts[1-us]:code}</b></div></div>`;
 h+=`<div class=felt>${seat(2,'st')}${seat(1,'sl')}<div class=ctr>${[2,1,3,0].map(r=>{const t=v.trick.find(x=>(x.s-v.me+4)%4==r);return `<div class="slot s${r}">${t?card(t.c,0,'','tc pop'):''}</div>`}).join('')}</div>${seat(3,'sr')}</div>`;
 const st=v.turn==v.me&&v.ph!='over'?'Your turn':(v.turn>=0&&['bid','trump','play'].includes(v.ph)?nm(v.turn)+(v.ph=='play'?' to play':v.ph=='bid'?' is bidding':' is choosing trump'):'');
 h+=`<div class=msg>${v.msg||st}</div><div class=act>`;
 if(v.ph=='lobby')h+=v.host?`<small>Friends joined ${v.human.filter(x=>x).length-1}/3 · empty seats become bots</small><button class=b onclick="send({t:'start'})">Start game</button>`:'<small>Waiting for host…</small>';
 else if(v.ph=='bid'&&v.turn==v.me){for(let n=v.min;n<=28;n++)h+=`<button class="b n" onclick="send({t:'bid',v:${n}})">${n}</button>`;h+=`<br><button class="b ghost" onclick="send({t:'bid',v:0})">Pass</button>`;if(v.canRedeal)h+=`<button class="b ghost" onclick="send({t:'redeal'})">Redeal</button>`}
 else if(v.ph=='trump'&&v.turn==v.me)h+=S.map(s=>`<button class="b suit ${'♥♦'.includes(s)?'':'ghost'}" style="${'♥♦'.includes(s)?'':''}" onclick="send({t:'trump',s:'${s}'})">${s}</button>`).join('');
 else if(v.ph=='over'&&v.host)h+=`<button class=b onclick="send({t:'next'})">Next round</button>`;
 h+='</div><div class=hand>'+v.hand.slice().sort((x,y)=>S.indexOf(su(x))-S.indexOf(su(y))||rk(x)-rk(y)).map(c=>card(c,v.legal.includes(c),`send({t:'play',c:'${c}'})`)).join('')+'</div>';
 a.innerHTML=h}
render();
</script></body></html>
